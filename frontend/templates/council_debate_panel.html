<div class="p-4">
    <h2 class="text-xl font-bold mb-4 text-sunbeam">Debate for {{ department|capitalize }}</h2>
    {% if debate %}
        <div class="mb-2 text-sm text-gray-400">Topic: {{ debate.topic }}</div>
        <div class="grid grid-cols-2 gap-4 mb-6">
            {% for advisor, arg in debate.arguments.items() %}
                <div class="bg-midnight rounded-lg p-3">
                    <div class="font-semibold text-sunbeam">{{ advisor }}</div>
                    <div class="text-xs text-gray-300 mt-1">{{ arg }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-gray-400">No debate yet.</div>
    {% endif %}
</div>
