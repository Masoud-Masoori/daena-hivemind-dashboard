<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS-AI - Daena AI VP | Executive Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.8"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'midnight': '#0a0a1e',
                        'deep-space': '#1a1a3e',
                        'cosmic-purple': '#2d1b69',
                        'neon-cyan': '#00ffff',
                        'sunbeam': '#ffd700',
                        'cyber-purple': '#8b5cf6',
                        'organic-green': '#10b981',
                        'royal-blue': '#6366f1',
                        'electric-pink': '#ec4899',
                        'fire-orange': '#f97316'
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite alternate',
                        'daena-speak': 'daena-speak 1.5s ease-in-out infinite alternate',
                        'hex-hover': 'hex-hover 0.3s ease-out',
                        'hex-pulse': 'hex-pulse 3s ease-in-out infinite',
                        'float-in': 'float-in 1s ease-out',
                        'particle': 'particle 25s infinite linear',
                        'voice-pulse': 'voice-pulse 1s ease-in-out infinite'
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%': { 
                                boxShadow: '0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.4)',
                                transform: 'scale(1)'
                            },
                            '100%': { 
                                boxShadow: '0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.6)',
                                transform: 'scale(1.02)'
                            }
                        },
                        'daena-speak': {
                            '0%': { 
                                boxShadow: '0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(0, 255, 255, 0.4)',
                                transform: 'scale(1.02)'
                            },
                            '100%': { 
                                boxShadow: '0 0 60px rgba(255, 215, 0, 1), 0 0 120px rgba(0, 255, 255, 0.6)',
                                transform: 'scale(1.05)'
                            }
                        },
                        'hex-hover': {
                            '0%': { transform: 'scale(1) rotate(0deg)' },
                            '100%': { transform: 'scale(1.1) rotate(2deg)' }
                        },
                        'hex-pulse': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.03)' }
                        },
                        'float-in': {
                            '0%': { 
                                transform: 'scale(0) rotate(-90deg)', 
                                opacity: '0'
                            },
                            '100%': { 
                                transform: 'scale(1) rotate(0deg)', 
                                opacity: '1'
                            }
                        },
                        'particle': {
                            '0%': { 
                                transform: 'translateY(100vh) translateX(0) rotate(0deg)', 
                                opacity: '0'
                            },
                            '10%': { opacity: '1' },
                            '90%': { opacity: '1' },
                            '100%': { 
                                transform: 'translateY(-100vh) translateX(200px) rotate(360deg)', 
                                opacity: '0'
                            }
                        },
                        'voice-pulse': {
                            '0%, 100%': { 
                                transform: 'scale(1)',
                                backgroundColor: 'rgba(16, 185, 129, 0.8)'
                            },
                            '50%': { 
                                transform: 'scale(1.2)',
                                backgroundColor: 'rgba(16, 185, 129, 1)'
                            }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Enhanced cosmic background */
        .cosmic-background {
            background: radial-gradient(circle at 20% 80%, #2d1b69 0%, #1a1a3e 25%, #0a0a1e 50%),
                        radial-gradient(circle at 80% 20%, #1a1a3e 0%, #2d1b69 25%, #0a0a1e 50%),
                        radial-gradient(circle at 40% 40%, #0a0a1e 0%, #1a1a3e 50%);
            background-size: 400% 400%;
            animation: cosmic-drift 20s ease infinite;
        }
        
        @keyframes cosmic-drift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Enhanced particle system */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .particle-small {
            width: 2px;
            height: 2px;
            background: rgba(99, 102, 241, 0.8);
        }
        
        .particle-medium {
            width: 4px;
            height: 4px;
            background: rgba(139, 92, 246, 0.6);
        }
        
        .particle-large {
            width: 6px;
            height: 6px;
            background: rgba(255, 215, 0, 0.4);
        }
        
        /* Smaller perfect hexagonal honeycomb shape */
        .hexagon {
            position: relative;
            width: 100px;
            height: 90px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .hexagon:hover {
            animation: hex-hover 0.3s ease-out forwards;
            z-index: 20;
        }
        
        .hexagon-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            background: linear-gradient(135deg, var(--hex-color-1), var(--hex-color-2));
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .hexagon:hover .hexagon-inner {
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .hexagon-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 80px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* Department-specific hexagon colors for honeycomb */
        .hex-engineering {
            --hex-color-1: #3b82f6;
            --hex-color-2: #1e40af;
        }
        
        .hex-product {
            --hex-color-1: #8b5cf6;
            --hex-color-2: #6366f1;
        }
        
        .hex-sales {
            --hex-color-1: #10b981;
            --hex-color-2: #059669;
        }
        
        .hex-marketing {
            --hex-color-1: #f97316;
            --hex-color-2: #ea580c;
        }
        
        .hex-finance {
            --hex-color-1: #06b6d4;
            --hex-color-2: #0891b2;
        }
        
        .hex-hr {
            --hex-color-1: #ec4899;
            --hex-color-2: #db2777;
        }
        
        .hex-customer {
            --hex-color-1: #84cc16;
            --hex-color-2: #65a30d;
        }
        
        .hex-legal {
            --hex-color-1: #6366f1;
            --hex-color-2: #4f46e5;
        }
        
        /* Smaller central Daena hub */
        .daena-hub {
            position: relative;
            width: 160px;
            height: 160px;
            background: conic-gradient(from 0deg, #ffd700, #00ffff, #8b5cf6, #10b981, #ffd700);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 30;
        }
        
        .daena-inner {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #0a0a1e 0%, #1a1a3e 70%, #2d1b69 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Voice indicator */
        .voice-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .voice-indicator.active {
            opacity: 1;
            animation: voice-pulse 1s ease-in-out infinite;
        }
        
        /* Enhanced sidebar - fixed positioning */
        .enhanced-sidebar {
            backdrop-filter: blur(25px);
            background: linear-gradient(135deg, rgba(10, 10, 30, 0.95), rgba(26, 26, 62, 0.9));
            border-left: 3px solid;
            border-image: linear-gradient(135deg, #6366f1, #8b5cf6) 1;
            z-index: 100;
        }
        
        /* Department room styles */
        .department-room {
            background: linear-gradient(135deg, rgba(10, 10, 30, 0.98), rgba(26, 26, 62, 0.95));
            backdrop-filter: blur(20px);
            z-index: 50;
        }
        
        /* Agent cards in department rooms */
        .agent-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .agent-card:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.2));
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }
        
        /* Voice chat interface */
        .voice-chat-panel {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 182, 212, 0.1));
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }
        
        /* Fixed system status panel positioning */
        .system-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 30, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 16px;
            min-width: 240px;
            z-index: 40;
        }
        
        /* Voice recording indicator */
        .voice-recording {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            z-index: 200;
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="cosmic-background text-white min-h-screen overflow-hidden">
    
    <!-- Enhanced particle system -->
    <div class="fixed inset-0 pointer-events-none z-0" id="particles"></div>
    
    <!-- Enhanced Header with Consistent Blue Theme -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-gradient-to-r from-blue-900/95 via-indigo-900/95 to-blue-800/95 backdrop-blur-md border-b-2 border-blue-400/30 z-50 shadow-lg shadow-blue-500/20">
        <div class="flex items-center justify-between px-8 h-full">
            <!-- Company Identity & Brand -->
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-cyan-500 rounded-lg flex items-center justify-center text-xl font-bold animate-pulse-glow shadow-lg shadow-blue-500/30"
                     title="🏠 MAS-AI Command Center">
                    🏠
                </div>
                <div>
                    <div class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                        MAS-AI COMMAND CENTER
                    </div>
                    <p class="text-xs text-blue-200/80">AI-Native Company Control Hub</p>
                </div>
            </div>
            
            <!-- Header Controls -->
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='/daena-office'" 
                        class="px-3 py-2 bg-purple-500/20 hover:bg-purple-500/30 rounded-lg transition-colors text-sm border border-purple-400/30 text-purple-200 hover:text-white">
                    <i class="fas fa-brain mr-2"></i>Daena Office
                </button>
                <button onclick="navigateToPage('/strategic-meetings'); showButtonFeedback('meetings')" 
                        class="px-3 py-2 bg-blue-500/20 hover:bg-blue-500/30 rounded-lg transition-colors text-sm border border-blue-400/30 text-blue-200 hover:text-white">
                    <i class="fas fa-calendar-alt mr-2"></i>Meetings
                </button>
                <button onclick="openAnalytics(); showButtonFeedback('analytics')" 
                        class="px-3 py-2 bg-indigo-500/20 hover:bg-indigo-500/30 rounded-lg transition-colors text-sm border border-indigo-400/30 text-indigo-200 hover:text-white">
                    <i class="fas fa-chart-bar mr-2"></i>Analytics
                </button>
                <button onclick="openFiles(); showButtonFeedback('files')" 
                        class="px-3 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 rounded-lg transition-colors text-sm border border-cyan-400/30 text-cyan-200 hover:text-white">
                    <i class="fas fa-folder mr-2"></i>Files
                </button>
                <button onclick="navigateToPage('/founder-panel'); showButtonFeedback('founder')" 
                        class="px-3 py-2 bg-amber-500/20 hover:bg-amber-500/30 rounded-lg transition-colors text-sm border border-amber-400/30 text-amber-200 hover:text-white">
                    <i class="fas fa-crown mr-2"></i>Founder
                </button>
                <button onclick="navigateToPage('/council-dashboard'); showButtonFeedback('council')" 
                        class="px-3 py-2 bg-cyber-purple/20 hover:bg-cyber-purple/30 rounded-lg transition-colors text-sm border border-cyber-purple/30 text-cyber-purple-200 hover:text-white">
                    <i class="fas fa-users-cog mr-2"></i>Council
                </button>
                <button onclick="navigateToPage('/council-debate'); showButtonFeedback('debate')" 
                        class="px-3 py-2 bg-sunbeam/20 hover:bg-sunbeam/30 rounded-lg transition-colors text-sm border border-sunbeam/30 text-sunbeam hover:text-midnight">
                    <i class="fas fa-comments mr-2"></i>Debate
                </button>
                <button onclick="navigateToPage('/council-synthesis'); showButtonFeedback('synthesis')" 
                        class="px-3 py-2 bg-green-500/20 hover:bg-green-500/30 rounded-lg transition-colors text-sm border border-green-400/30 text-green-200 hover:text-white">
                    <i class="fas fa-brain mr-2"></i>Synthesis
                </button>
            </div>
        </div>
    </header>
    
    <!-- Voice Recording Indicator -->
    <div x-show="isRecording" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-90"
         x-transition:enter-end="opacity-100 scale-100"
         class="fixed top-20 right-6 bg-organic-green/90 text-white px-4 py-2 rounded-lg z-200 backdrop-blur-10">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
            <span class="font-semibold text-sm">🎤 Voice Active</span>
        </div>
    </div>
    
    <!-- Main Dashboard -->
    <div x-data="enhancedDashboard()" x-init="initializeDashboard()" class="relative w-full h-screen pt-16">
        
        <!-- Honeycomb Ecosystem -->
        <div class="absolute inset-0 flex items-center justify-center" id="ecosystem">
            
            <!-- Central Daena Hub -->
            <div class="absolute z-30 transition-all duration-500"
                 @click="openDaenaOffice()"
                 :class="{ 'animate-daena-speak': daenaSpeaking }">
                <div class="daena-hub animate-pulse-glow">
                    <div class="daena-inner">
                        <div class="text-3xl mb-2">🧠</div>
                        <div class="text-sm font-bold text-sunbeam">Daena VP</div>
                        
                        <!-- Voice indicator -->
                        <div class="voice-indicator" :class="{ 'active': voiceMode }"></div>
                        
                        <!-- Status ring -->
                        <div class="absolute -inset-3 rounded-full border-2 border-sunbeam/30 animate-spin" style="animation-duration: 20s;"></div>
                    </div>
                </div>
                
                <!-- System metrics -->
                <div class="absolute -bottom-12 left-1/2 transform -translate-x-1/2 text-center">
                    <div class="text-xs font-bold text-sunbeam" x-text="systemStats.agents + ' Agents'"></div>
                    <div class="text-xs text-neon-cyan" x-text="systemStats.efficiency + '% Efficiency'"></div>
                </div>
            </div>
            
            <!-- Department Hexagons in Perfect Circle -->
            <template x-for="(dept, index) in departments" :key="dept.id">
                <div class="absolute department cursor-pointer transform transition-all duration-700 animate-float-in"
                     :style="getCircularPosition(index)"
                     @click="enterDepartmentRoom(dept)"
                     @mouseenter="highlightDepartment(dept.id)"
                     @mouseleave="clearHighlights()">
                    
                    <div class="hexagon" :class="'hex-' + dept.id">
                        <div class="hexagon-inner animate-hex-pulse" 
                             :style="'animation-delay: ' + (index * 0.3) + 's'"></div>
                        
                        <div class="hexagon-content">
                            <div class="text-xl mb-1" x-text="dept.icon"></div>
                            <div class="text-xs font-bold text-white text-center leading-tight" x-text="dept.name"></div>
                            <div class="text-xs text-gray-200 mt-1" x-text="dept.agents + ' agents'"></div>
                            
                            <!-- Performance indicator -->
                            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2">
                                <div class="w-3 h-3 rounded-full"
                                     :class="dept.performance >= 90 ? 'bg-organic-green animate-pulse' : 
                                             dept.performance >= 80 ? 'bg-sunbeam animate-pulse' : 'bg-fire-orange animate-pulse'"></div>
                            </div>
                            
                            <!-- Voice indicator for department -->
                            <div class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-organic-green opacity-0 transition-opacity duration-300"
                                 :class="{ 'opacity-100 animate-voice-pulse': dept.voiceActive }"></div>
                        </div>
                        
                        <!-- Enhanced Hover info -->
                        <div class="absolute -bottom-20 left-1/2 transform -translate-x-1/2 
                                    opacity-0 hover:opacity-100 transition-opacity duration-300
                                    bg-midnight/95 backdrop-blur-sm rounded-lg p-3 border border-royal-blue/30
                                    min-w-44 text-center z-20 pointer-events-none group-hover:pointer-events-auto">
                            <div class="font-semibold text-white mb-1 text-sm" x-text="dept.fullName"></div>
                            <div class="text-xs text-gray-300 mb-2" x-text="dept.details"></div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-royal-blue">Agents: <span x-text="dept.agents"></span></span>
                                <span class="text-cyber-purple">Projects: <span x-text="dept.projects"></span></span>
                            </div>
                            <div class="text-xs text-organic-green">Performance: <span x-text="dept.performance + '%'"></span></div>
                            <div class="text-xs text-neon-cyan mt-1 font-semibold">🏢 Click to Enter</div>
                        </div>
                    </div>
                </div>
            </template>
            
        </div>
        
        <!-- Connection Lines -->
        <svg class="absolute inset-0 pointer-events-none z-20" id="connectionsSvg">
            <!-- Animated connection lines will be drawn here -->
        </svg>
        
        <!-- Department Room Modal -->
        <div x-show="departmentRoomOpen" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-50 department-room"
             @click.self="closeDepartmentRoom()">
            
            <div class="w-full h-full flex flex-col">
                <!-- Department Room Header -->
                <div class="flex-shrink-0 p-4 border-b border-royal-blue/30">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="text-2xl" x-text="currentDepartment?.icon"></div>
                            <div>
                                <h2 class="text-xl font-bold text-white" x-text="currentDepartment?.fullName"></h2>
                                <p class="text-gray-400 text-sm" x-text="currentDepartment?.description"></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <!-- Voice Chat Toggle -->
                            <button @click="toggleDepartmentVoice()" 
                                    class="px-3 py-2 rounded-lg transition-all duration-300 text-sm"
                                    :class="departmentVoiceActive ? 'bg-organic-green/30 text-organic-green animate-pulse' : 'bg-gray-600/30 text-gray-400'">
                                <i class="fas fa-microphone mr-2"></i>
                                <span x-text="departmentVoiceActive ? 'Voice Active' : 'Start Voice'"></span>
                            </button>
                            <button @click="closeDepartmentRoom()" 
                                    class="text-gray-400 hover:text-white text-xl">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="flex-1 flex overflow-hidden">
                    <!-- Left Panel: Agents -->
                    <div class="w-1/3 p-4 border-r border-royal-blue/30 overflow-y-auto">
                        <h3 class="text-lg font-bold text-white mb-4">
                            <i class="fas fa-robot mr-2 text-cyber-purple"></i>
                            Department Agents
                        </h3>
                        
                        <div class="space-y-3" x-html="getDepartmentAgentsHTML()">
                            <!-- Agents will be populated here -->
                        </div>
                        
                        <!-- All Agents Chat Button -->
                        <button @click="startGroupChat()" 
                                class="w-full mt-4 px-4 py-3 bg-gradient-to-r from-cyber-purple to-royal-blue 
                                       rounded-lg hover:from-cyber-purple/80 hover:to-royal-blue/80 transition-all text-sm">
                            <i class="fas fa-users mr-2"></i>
                            Chat with All Agents + Daena VP
                        </button>
                    </div>
                    
                    <!-- Right Panel: Chat Interface -->
                    <div class="flex-1 flex flex-col">
                        <!-- Chat Messages -->
                        <div class="flex-1 p-4 overflow-y-auto" id="departmentChatMessages">
                            <div class="space-y-3" x-html="departmentChatHTML">
                                <!-- Chat messages will appear here -->
                            </div>
                        </div>
                        
                        <!-- Voice Chat Panel -->
                        <div x-show="departmentVoiceActive" 
                             class="mx-4 mb-3 p-3 voice-chat-panel">
                            <div class="flex items-center justify-center space-x-4">
                                <div class="w-10 h-10 bg-organic-green/20 rounded-full flex items-center justify-center animate-voice-pulse">
                                    <i class="fas fa-microphone text-organic-green"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="text-sm text-organic-green font-semibold">Voice Chat Active</div>
                                    <div class="text-xs text-gray-400">Speak to chat with agents and Daena</div>
                                </div>
                                <button @click="toggleDepartmentVoice()" 
                                        class="px-3 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 text-sm">
                                    <i class="fas fa-stop mr-2"></i>Stop
                                </button>
                            </div>
                        </div>
                        
                        <!-- Text Input -->
                        <div class="p-4 border-t border-royal-blue/30">
                            <div class="flex space-x-3">
                                <input type="text" 
                                       x-model="departmentMessage"
                                       @keydown.enter="sendDepartmentMessage()"
                                       class="flex-1 bg-midnight/60 border border-royal-blue/30 rounded-lg px-4 py-2 
                                              text-white placeholder-gray-400 focus:outline-none focus:border-royal-blue text-sm"
                                       placeholder="Chat with department agents and Daena VP...">
                                <button @click="sendDepartmentMessage()"

                // Perfect circular positioning (honeycomb structure)
                getCircularPosition(index) {
                    const total = this.departments.length;
                    const angle = (index * 360) / total; // Even distribution in circle
                    const radius = 240; // Smaller radius for better fit
                    
                    const radian = (angle * Math.PI) / 180;
                    const x = Math.cos(radian) * radius;
                    const y = Math.sin(radian) * radius;
                    
                    return {
                        transform: `translate(${x}px, ${y}px)`,
                        animationDelay: `${index * 0.15}s`
                    };

                // Enhanced particle system
                createEnhancedParticles() {
                    const container = document.getElementById('particles');
                    const particleTypes = ['particle-small', 'particle-medium', 'particle-large'];
                    
                    for (let i = 0; i < 60; i++) {
                        const particle = document.createElement('div');
                        const type = particleTypes[Math.floor(Math.random() * particleTypes.length)];
                        
                        particle.className = `particle ${type} animate-particle`;
                        particle.style.left = Math.random() * 100 + '%';
                        particle.style.animationDelay = Math.random() * 25 + 's';
                        particle.style.animationDuration = (20 + Math.random() * 10) + 's';
                        
                        container.appendChild(particle);
                    }
                },
                
                // Enhanced honeycomb connection lines
                drawHoneycombConnections() {
                    const svg = document.getElementById('connectionsSvg');
                    svg.innerHTML = '';
                    
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    
                    this.departments.forEach((dept, index) => {
                        const position = this.getCircularPosition(index);
                        const transform = position.transform;
                        const match = transform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
                        
                        if (match) {
                            const x = centerX + parseFloat(match[1]);
                            const y = centerY + parseFloat(match[2]);
                            
                            // Create animated line
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', centerX);
                            line.setAttribute('y1', centerY);
                            line.setAttribute('x2', x);
                            line.setAttribute('y2', y);
                            line.setAttribute('stroke', `url(#gradient-${dept.id})`);
                            line.setAttribute('stroke-width', '2');
                            line.setAttribute('opacity', '0.4');
                            line.setAttribute('id', `connection-${dept.id}`);
                            
                            // Create gradient for each line
                            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                            const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                            gradient.setAttribute('id', `gradient-${dept.id}`);
                            gradient.setAttribute('x1', '0%');
                            gradient.setAttribute('y1', '0%');
                            gradient.setAttribute('x2', '100%');
                            gradient.setAttribute('y2', '0%');
                            
                            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                            stop1.setAttribute('offset', '0%');
                            stop1.setAttribute('stop-color', '#ffd700');
                            stop1.setAttribute('stop-opacity', '0.8');

                            stop2.setAttribute('offset', '100%');
                            stop2.setAttribute('stop-color', '#6366f1');
                            stop2.setAttribute('stop-opacity', '0.4');
                            
                            gradient.appendChild(stop1);
                            gradient.appendChild(stop2);
                            defs.appendChild(gradient);
                            svg.appendChild(defs);
                            svg.appendChild(line);
                        }
                    });
                },
                
                // Enhanced speech synthesis setup

                // Initialize speech recognition for voice commands
                initializeSpeechRecognition() {
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        this.recognition = new SpeechRecognition();
                        
                        this.recognition.continuous = true;
                        this.recognition.interimResults = true;
                        this.recognition.lang = 'en-US';
                        
                        this.recognition.onstart = () => {
                            this.isRecording = true;
                            console.log('🎤 Voice recognition started');
                        };
                        
                        this.recognition.onend = () => {
                            this.isRecording = false;
                            if (this.voiceMode) {
                                // Restart recognition if voice mode is still active
                                setTimeout(() => {
                                    if (this.voiceMode) {
                                        this.recognition.start();
                                    }
                                }, 1000);
                            }
                        };
                        
                        this.recognition.onresult = (event) => {
                            let finalTranscript = '';
                            for (let i = event.resultIndex; i < event.results.length; i++) {
                                if (event.results[i].isFinal) {
                                    finalTranscript += event.results[i][0].transcript;
                                }
                            }
                            
                            if (finalTranscript.trim()) {
                                console.log('🎤 Voice input:', finalTranscript);
                                this.processVoiceCommand(finalTranscript);
                            }
                        };
                        
                        this.recognition.onerror = (event) => {
                            console.error('Voice recognition error:', event.error);
                            this.isRecording = false;
                        };
                        
                        console.log('✅ Speech recognition initialized');
                    } else {
                        console.warn('⚠️ Speech recognition not supported in this browser');
                    }
                },

                // Enhanced text-to-speech with custom voice support
                async speakText(text, voiceType = 'daena') {
                    if (!text || text.trim() === '') return;
                    
                    try {
                        // Try to use custom audio for Daena first
                        if (voiceType === 'daena' && this.voiceSettings.daena.customAudio) {
                            const success = await this.playCustomAudio(text);
                            if (success) return; // If custom audio worked, we're done
                        }
                        
                        // Fall back to speech synthesis
                        if (this.synthesis) {
                            // Stop any current speech
                            this.synthesis.cancel();
                            
                            const utterance = new SpeechSynthesisUtterance(text);
                            
                            // Determine voice type based on agent name or specified type
                            let voiceConfig;
                            if (voiceType === 'daena') {
                                voiceConfig = this.voiceSettings.daena;
                            } else if (voiceType === 'agent') {
                                // Determine gender based on common name patterns (basic implementation)
                                const femaleNames = ['sarah', 'emma', 'olivia', 'sophia', 'isabella', 'maya', 'zoe', 'alex', 'jamie'];
                                const maleNames = ['john', 'david', 'michael', 'james', 'robert', 'william', 'mark', 'paul', 'chris'];
                                
                                const lowerText = text.toLowerCase();
                                const isFemale = femaleNames.some(name => lowerText.includes(name));
                                const isMale = maleNames.some(name => lowerText.includes(name));
                                
                                voiceConfig = isFemale ? this.voiceSettings.agent_female : 
                                             isMale ? this.voiceSettings.agent_male : 
                                             this.voiceSettings.agent_female; // Default to female
                            } else {
                                voiceConfig = this.voiceSettings.agent_male;
                            }
                            
                            // Apply voice settings
                            if (voiceConfig.voice) {
                                utterance.voice = voiceConfig.voice;
                            }
                            utterance.pitch = voiceConfig.pitch || 1.0;
                            utterance.rate = voiceConfig.rate || 1.0;
                            utterance.volume = voiceConfig.volume || 1.0;
                            
                            // Visual feedback
                            if (voiceType === 'daena') {
                                this.daenaSpeaking = true;
                                utterance.onend = () => {
                                    this.daenaSpeaking = false;
                                };
                            }
                            
                            this.synthesis.speak(utterance);
                            console.log(`🔊 Speaking as ${voiceType}:`, text);
                        }
                    } catch (error) {
                        console.error('Error in text-to-speech:', error);
                    }
                },
                
                // Play custom audio file for Daena
                async playCustomAudio(text) {
                    try {
                        // For now, we'll use the speech synthesis as fallback
                        // In a full implementation, you would:
                        // 1. Send text to a TTS service that uses your custom voice
                        // 2. Or have pre-recorded audio clips
                        // 3. Or use Web Audio API with voice cloning
                        
                        console.log('🎵 Using custom Daena voice for:', text);
                        
                        // Check if custom audio file exists
                        const audio = new Audio('/static/audio/daena_voice.wav');
                        return new Promise((resolve) => {
                            audio.oncanplaythrough = () => {
                                audio.play().then(() => {
                                    resolve(true);
                                }).catch(() => {
                                    resolve(false);
                                });
                            };

                // Process voice commands like Jarvis
                processVoiceCommand(command) {
                    const lowerCommand = command.toLowerCase();
                    
                    // Jarvis-style activation words
                    if (lowerCommand.includes('hey daena') || lowerCommand.includes('daena') || 
                        lowerCommand.includes('jarvis') || lowerCommand.includes('hey jarvis')) {
                        
                        this.daenaSpeaking = true;
                        
                        // Extract the actual command after activation
                        let actualCommand = command;
                        if (lowerCommand.includes('hey daena')) {
                            actualCommand = command.substring(command.toLowerCase().indexOf('hey daena') + 9);
                        } else if (lowerCommand.includes('daena')) {
                            actualCommand = command.substring(command.toLowerCase().indexOf('daena') + 5);
                        } else if (lowerCommand.includes('hey jarvis')) {
                            actualCommand = command.substring(command.toLowerCase().indexOf('hey jarvis') + 10);
                        } else if (lowerCommand.includes('jarvis')) {
                            actualCommand = command.substring(command.toLowerCase().indexOf('jarvis') + 6);
                        }
                        
                        actualCommand = actualCommand.trim();
                        
                        // Process Jarvis-style commands
                        if (actualCommand.includes('open') || actualCommand.includes('show')) {
                            this.handleOpenCommand(actualCommand);
                        } else if (actualCommand.includes('status') || actualCommand.includes('report')) {
                            this.handleStatusCommand();
                        } else if (actualCommand.includes('department')) {
                            this.handleDepartmentCommand(actualCommand);
                        } else if (actualCommand.includes('meeting') || actualCommand.includes('schedule')) {
                            this.handleMeetingCommand();
                        } else if (actualCommand.includes('analytics') || actualCommand.includes('data')) {
                            this.handleAnalyticsCommand();
                        } else if (actualCommand === '' || actualCommand.includes('hello') || actualCommand.includes('hi')) {
                            this.handleGreeting();
                        } else {
                            this.handleGeneralQuery(actualCommand);
                        }
                        
                        setTimeout(() => {
                            this.daenaSpeaking = false;
                        }, 3000);
                    } else if (this.departmentRoomOpen) {
                        // In department room, process as department message
                        this.departmentMessage = command;
                        this.sendDepartmentMessage();
                    }
                },
                
                // Jarvis-style command handlers
                handleOpenCommand(command) {
                    if (command.includes('office')) {
                        this.speakText("Opening executive office command center.", 'daena');
                        setTimeout(() => this.openDaenaOffice(), 1000);
                    } else if (command.includes('engineering')) {
                        this.speakText("Accessing engineering department.", 'daena');
                        setTimeout(() => this.enterDepartmentRoom(this.departments.find(d => d.id === 'engineering')), 1000);
                    } else if (command.includes('meeting')) {
                        this.speakText("Opening meeting rooms and strategic sessions.", 'daena');
                        setTimeout(() => this.openMeetings(), 1000);
                    } else if (command.includes('analytics')) {
                        this.speakText("Displaying system analytics and performance metrics.", 'daena');
                        setTimeout(() => this.openAnalytics(), 1000);
                    } else {
                        this.speakText("Please specify what you'd like me to open. Available options: office, engineering, sales, marketing, finance, HR, customer, legal, meetings, or analytics.", 'daena');

                },
