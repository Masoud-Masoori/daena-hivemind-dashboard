<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
}

function toggleVoiceBot() {
    // Toggle voice bot visibility and functionality
    const voiceBot = document.getElementById('daena-voice-bot');
    if (voiceBot) {
        voiceBot.classList.toggle('hidden');
    }
    
    // Start voice recognition if enabled
    if (window.voiceEnabled) {
        startVoiceRecognition();
    }
}

function logout() {
    // Clear any stored tokens
    localStorage.removeItem('auth_token');
    sessionStorage.clear();
    
    // Redirect to login page
    window.location.href = '/login';
}

// Voice recognition functionality
let recognition = null;

function startVoiceRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Speech recognition not supported in this browser');
        return;
    }

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = function() {
        console.log('Voice recognition started');
        document.getElementById('voice-toggle').classList.add('text-fire-orange');
    };

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        console.log('Heard:', transcript);
        
        // Check for wake word
        if (transcript.toLowerCase().includes('hey daena') || transcript.toLowerCase().includes('daena')) {
            processVoiceCommand(transcript);
        }
    };

    recognition.onerror = function(event) {
        console.error('Speech recognition error:', event.error);
        document.getElementById('voice-toggle').classList.remove('text-fire-orange');
    };

    recognition.onend = function() {
        console.log('Voice recognition ended');
        document.getElementById('voice-toggle').classList.remove('text-fire-orange');
    };

    recognition.start();
}

function processVoiceCommand(transcript) {
    // Send to backend for processing
    fetch('/api/v1/daena/voice', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            text: transcript,
            user_id: 'founder'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.response) {
            // Play audio response if available
            if (data.audio_url) {
                const audio = new Audio(data.audio_url);
                audio.play();
            }
            
            // Show text response
            showVoiceResponse(data.response);
        }
    })
    .catch(error => {
        console.error('Error processing voice command:', error);
    });
}

function showVoiceResponse(response) {
    // Create a temporary notification
    const notification = document.createElement('div');
    notification.className = 'fixed bottom-4 right-4 bg-midnight border border-organic-green/30 rounded-lg p-4 text-white max-w-sm z-50';
    notification.innerHTML = `
        <div class="flex items-center space-x-2 mb-2">
            <div class="w-6 h-6 bg-gradient-to-br from-sunbeam to-fire-orange rounded-full flex items-center justify-center">
                <span class="text-midnight font-bold text-xs">D</span>
            </div>
            <span class="font-semibold text-sunbeam">Daena</span>
        </div>
        <p class="text-sm">${response}</p>
    `;
    
    document.body.appendChild(notification);
    
    // Remove after 5 seconds
    setTimeout(() => {
        notification.remove();
    }, 5000);
}

// Initialize voice recognition on page load
document.addEventListener('DOMContentLoaded', function() {
    // Check if voice is enabled
    window.voiceEnabled = true; // This could be a setting
    
    // Add voice bot to page if not already present
    if (!document.getElementById('daena-voice-bot')) {
        const voiceBot = document.createElement('div');
        voiceBot.id = 'daena-voice-bot';
        voiceBot.className = 'fixed bottom-4 right-4 z-40';
        voiceBot.innerHTML = `
            <div class="w-16 h-16 bg-gradient-to-br from-sunbeam to-fire-orange rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:shadow-xl transition-shadow" onclick="toggleVoiceBot()">
                <svg class="w-8 h-8 text-midnight" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </div>
        `;
        document.body.appendChild(voiceBot);
    }
});
</script>
