    <!-- Custom Styles -->
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00d4aa;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #ffd700;
        }
        
        /* Smooth transitions */
        * {
            transition: all 0.2s ease-in-out;
        }
        
        /* Focus styles */
        .focus-ring:focus {
            outline: 2px solid #00d4aa;
            outline-offset: 2px;
        }
        
        /* Loading animation */
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #00d4aa, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Glass effect */
        .glass {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 170, 0.2);
        }
        
        /* Hover effects */
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 170, 0.2);
        }
        
        /* Status indicators */
        .status-online {
            background: #00d4aa;
            box-shadow: 0 0 10px rgba(0, 212, 170, 0.5);
        }
        
        .status-offline {
            background: #ef5350;
            box-shadow: 0 0 10px rgba(239, 83, 80, 0.5);
        }
        
        .status-warning {
            background: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

<body class="bg-midnight text-white min-h-screen font-sans">
    <!-- Include the unified navbar -->

    <!-- Main content area -->
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-deep-space border-t border-organic-green/20 py-6 mt-auto">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-4 mb-4 md:mb-0">
                    <div class="w-8 h-8 bg-gradient-to-br from-sunbeam to-fire-orange rounded-lg flex items-center justify-center">
                        <span class="text-midnight font-bold text-sm">D</span>
                    </div>
                    <span class="text-organic-green font-semibold">Daena AI VP System</span>
                </div>
                <div class="flex items-center space-x-6 text-sm text-gray-400">
                    <span>© 2025 Mas-AI Company</span>
                    <span>•</span>
                    <a href="/privacy" class="hover:text-organic-green transition-colors">Privacy</a>
                    <span>•</span>
                    <a href="/terms" class="hover:text-organic-green transition-colors">Terms</a>
                    <span>•</span>
                    <a href="/support" class="hover:text-organic-green transition-colors">Support</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Global JavaScript -->
    <script>
        // Global utility functions
        window.DaenaUtils = {
            // Show notification
            showNotification: function(message, type = 'info', duration = 5000) {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg max-w-sm animate-slide-up`;
                
                const colors = {
                    'info': 'bg-blue-500 text-white',
                    'success': 'bg-green-500 text-white',
                    'warning': 'bg-yellow-500 text-black',
                    'error': 'bg-red-500 text-white'
                };
                
                notification.className += ` ${colors[type] || colors.info}`;
                notification.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold">${message}</span>
                        <button onclick="this.parentElement.parentElement.remove()" class="ml-auto text-white/80 hover:text-white">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.remove();
                    }
                }, duration);
            },
            
            // Format date
            formatDate: function(date) {
                return new Intl.DateTimeFormat('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(new Date(date));
            },
            
            // Format number with commas
            formatNumber: function(num) {
                return new Intl.NumberFormat('en-US').format(num);
            },
            
            // Debounce function
            debounce: function(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },
            
            // Check if user is authenticated
            isAuthenticated: function() {
                return localStorage.getItem('auth_token') !== null;
            },
            
            // Get auth token
            getAuthToken: function() {
                return localStorage.getItem('auth_token');
            },
            
            // Set auth token
            setAuthToken: function(token) {
                localStorage.setItem('auth_token', token);
            },
            
            // Remove auth token
            removeAuthToken: function() {
                localStorage.removeItem('auth_token');
            },
            
            // Make authenticated request
            authenticatedFetch: function(url, options = {}) {
                const token = this.getAuthToken();
                if (token) {
                    options.headers = {
                        ...options.headers,
                        'Authorization': `Bearer ${token}`
                    };
                }
                return fetch(url, options);
            }
        };
        
        // Global error handler
        window.addEventListener('error', function(event) {
            console.error('Global error:', event.error);
            DaenaUtils.showNotification('An error occurred. Please try again.', 'error');
        });
        
        // Handle authentication errors
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.status === 401) {
                DaenaUtils.removeAuthToken();
                window.location.href = '/login';
            }
        });
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Add loading states to buttons
            document.querySelectorAll('button[type="submit"]').forEach(button => {
                button.addEventListener('click', function() {
                    if (!this.disabled) {
                        this.disabled = true;
                        this.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Loading...';
                    }
                });
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
