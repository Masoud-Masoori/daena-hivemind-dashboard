<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#brainGradient)" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Brain icon -->
  <g transform="translate(8, 8)" fill="#ffffff" filter="url(#glow)">
    <!-- Brain lobes -->
    <path d="M8 4c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5 2.5-1 2.5-2.5S9.5 4 8 4z"/>
    <path d="M8 12c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5 2.5-1 2.5-2.5S9.5 12 8 12z"/>
    
    <!-- Brain connections -->
    <path d="M6 6.5h4" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M6 14.5h4" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M8 6.5v8" stroke="#ffffff" stroke-width="1" fill="none"/>
  </g>
  
  <!-- AI indicator -->
  <circle cx="24" cy="8" r="3" fill="#10b981" opacity="0.8"/>
  <text x="24" y="10" text-anchor="middle" font-size="6" fill="#ffffff" font-family="Arial, sans-serif">AI</text>
</svg> 